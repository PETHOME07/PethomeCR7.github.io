
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registrar mascota - App de Mascotas</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:flex-start;
    padding:32px 16px;
    /* Imagen de fondo */
    background:
    linear-gradient(rgba(255,255,255,.80),rgba(224,247,250,.80)),
    url("img/mascotas.jpg");
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;
}
/* Contenedor principal */
.contenedor{
    width:min(100%, 560px);
    background:rgba(255,255,255,.85);
    border-radius:8px;
    padding:28px;
    box-shadow:0 4px 18px rgba(0,0,0,.15);
}
h1{ color:#008ecf; font-size:25px; margin-bottom:20px; }
h2{ color:#333; font-size:17px; margin:20px 0 10px; }
.campo{ display:flex; flex-direction:column; gap:5px; margin-bottom:12px; }
label{ color:#333; font-size:14px; font-weight:bold; }
input, textarea{
    width:100%;
    padding:10px;
    border:1px solid #9cc8d8;
    border-radius:4px;
    font-size:15px;
}
textarea{ min-height:72px; resize:vertical; }
.mensaje{ min-height:20px; margin-top:12px; font-size:14px; }
.mensaje.error{ color:#b42318; }
.mensaje.exito{ color:#087443; }
/* Botones */
.botones-contenedor{
    display:flex;
    gap:15px;
    margin-top:10px;
}
button{
    flex:1;
    height:48px;
    background:white;
    color:#008ecf;
    border:2px solid #008ecf;
    border-radius:8px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    box-shadow:0 4px 10px rgba(0,0,0,.15);
}
button:hover{
    background:#00b4d8;
    color:white;
    transform:scale(1.05);
}
button.btn-regresar{
    border-color:#666;
    color:#666;
}
button.btn-regresar:hover{
    background:#666;
    color:white;
}
</style>
</head>
<body>
<div class="contenedor">
    <h1>Registrar mascota</h1>
    <form id="formulario-registro" enctype="multipart/form-data">
        <h2>Propietario</h2>
        <div class="campo">
            <label for="propietarioNombre">Nombre</label>
            <input id="propietarioNombre" name="propietarioNombre" type="text" required>
        </div>
        <div class="campo">
            <label for="propietarioTelefono">Teléfono</label>
            <input id="propietarioTelefono" name="propietarioTelefono" type="tel" required>
        </div>
        <h2>Mascota</h2>
        <div class="campo">
            <label for="mascotaNombre">Nombre</label>
            <input id="mascotaNombre" name="mascotaNombre" type="text" required>
        </div>
        <div class="campo">
            <label for="mascotaDescripcion">Descripción</label>
            <textarea id="mascotaDescripcion" name="mascotaDescripcion" required></textarea>
        </div>
        <div class="campo">
            <label for="razaCode">Raza</label>
            <select id="razaCode" name="razaCode" required>
                <option value="">Cargando razas...</option>
            </select>
        </div>
        <div class="campo">
            <label for="imagen">Imagen de la mascota</label>
            <input id="imagen" name="imagen" type="file" accept="image/*" required>
        </div>
        <h2>Publicación</h2>
        <div class="campo">
            <label for="publicidadDescripcion">Descripción del aviso</label>
            <textarea id="publicidadDescripcion" name="publicidadDescripcion" required></textarea>
        </div>
        <div class="campo">
            <label for="recompensa">Recompensa</label>
            <input id="recompensa" name="recompensa" type="number" min="0" step="0.01">
        </div>
        <div class="campo">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>
        </div>
        <div class="botones-contenedor">
            <button type="button" onclick="registrarPublicidad()">REGISTRAR</button>
            <button type="button" class="btn-regresar" onclick="window.location.href='index.html'">REGRESAR</button>
        </div>
        <p id="mensaje-registro" class="mensaje" aria-live="polite"></p>
    </form>
</div>
<script src="app.js"></script>
</body>
</html>
